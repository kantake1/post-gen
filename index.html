<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>ポスター工房</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Noto+Sans+JP:wght@500;700;900&family=Shippori+Mincho+B1:wght@800&family=Zen+Antique&family=Zen+Maru+Gothic:wght@900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* layout: 左に操作パネル、右にポスター。ポスター上の要素をドラッグ・拡縮・回転して編集する */
:root {
  --bg: #f3f4f8; --panel: #ffffff; --fg: #171a2b; --muted: #636985;
  --line: #dcdfea; --accent: #2f3fd0; --on-accent: #ffffff; --stage: #e4e6f0;
  --ui: "Noto Sans JP", system-ui, -apple-system, "Hiragino Sans", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1120; --panel: #171a2e; --fg: #eceefb; --muted: #9aa0c0;
    --line: #2a2e4a; --accent: #8c98ff; --on-accent: #0f1120; --stage: #0a0b17; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1120; --panel: #171a2e; --fg: #eceefb; --muted: #9aa0c0;
  --line: #2a2e4a; --accent: #8c98ff; --on-accent: #0f1120; --stage: #0a0b17; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 14px; line-height: 1.6; padding-inline: 16px; padding-block: 16px 40px; }
h1 { font-size: 20px; font-weight: 900; letter-spacing: .04em; margin: 0; }
header { max-width: 1280px; margin: 0 auto 16px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
header p { margin: 0; color: var(--muted); font-size: 13px; }
.app { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 20px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-width: 0; }
.group { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.group:last-child { border-bottom: 0; }
.group > h2 { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--muted); }
label, .cp { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
label.inline { flex-direction: row; align-items: center; gap: 8px; }
input[type=text], textarea, select { width: 100%; font: inherit; font-size: 14px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; }
textarea { resize: vertical; min-height: 60px; }
input[type=color] { width: 100%; height: 34px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
input[type=range] { width: 100%; accent-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 0; min-width: 0; }
.btn { font: inherit; font-weight: 700; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; cursor: pointer; text-align: center; text-decoration: none; display: inline-block; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.sm { padding: 5px 8px; font-size: 12px; }
.tpls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tpl { font: inherit; text-align: left; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; cursor: pointer; display: flex; flex-direction: column; }
.tpl b { font-size: 14px; }
.tpl span { font-size: 11px; color: var(--muted); }
.tpl[aria-pressed=true] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { flex: 1; font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 0; border-right: 1px solid var(--line); padding: 6px; cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed=true] { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.pals { display: flex; gap: 8px; flex-wrap: wrap; }
.pal { width: 44px; height: 30px; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; padding: 0; }
.pal.sm { width: 100%; height: 34px; }
.pal[aria-pressed=true] { outline: 2px solid var(--accent); outline-offset: 1px; }
.layers { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow: auto; }
.layer { font: inherit; font-size: 13px; text-align: left; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.layer[aria-pressed=true] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.stage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); background: var(--stage); border: 1px solid var(--line); border-radius: 10px; padding: 14px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }
.bar { display: flex; gap: 8px; align-items: center; width: 100%; flex-wrap: wrap; }
.bar .hint { font-size: 12px; color: var(--muted); flex: 1 1 200px; }
.cvwrap { position: relative; display: inline-block; line-height: 0; max-width: 100%; }
#cv { display: block; max-width: 100%; max-height: calc(100vh - 190px); width: auto; height: auto; box-shadow: 0 6px 30px rgba(0,0,0,.28); }
#ov { position: absolute; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
.ob { position: absolute; cursor: move; }
.ob:hover { outline: 1px dashed var(--accent); }
.ob.sel { outline: 2px solid var(--accent); z-index: 5; }
.h { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; background: #fff; border: 2px solid var(--accent); border-radius: 3px; }
.h[data-h=nw] { left: 0; top: 0; cursor: nwse-resize; } .h[data-h=n] { left: 50%; top: 0; cursor: ns-resize; }
.h[data-h=ne] { left: 100%; top: 0; cursor: nesw-resize; } .h[data-h=e] { left: 100%; top: 50%; cursor: ew-resize; }
.h[data-h=se] { left: 100%; top: 100%; cursor: nwse-resize; } .h[data-h=s] { left: 50%; top: 100%; cursor: ns-resize; }
.h[data-h=sw] { left: 0; top: 100%; cursor: nesw-resize; } .h[data-h=w] { left: 0; top: 50%; cursor: ew-resize; }
.h[data-h=rot] { left: 50%; top: -28px; border-radius: 50%; cursor: grab; }
@media (pointer: coarse) { .h { width: 20px; height: 20px; margin: -10px 0 0 -10px; } }
.guide { position: absolute; background: #ff3d9a; pointer-events: none; z-index: 9; }
.guide.v { width: 1px; top: 0; bottom: 0; } .guide.h { height: 1px; left: 0; right: 0; }
.meta { margin: 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.modal { position: fixed; inset: 0; background: rgba(8,10,24,.66); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.sheet { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; width: min(720px, 100%); max-height: 100%; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet-head h2 { margin: 0; font-size: 16px; }
.sheet img.out { max-width: 100%; max-height: 52vh; width: auto; height: auto; align-self: center; border: 1px solid var(--line); }
.sheet textarea { min-height: 220px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.note { margin: 0; font-size: 12px; color: var(--muted); }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .stage { position: static; order: -1; padding: 12px; }
  #cv { max-height: 60vh; }
}
@media (prefers-reduced-motion: no-preference) { .btn, .tpl { transition: border-color .15s; } }
</style>

</head>
<body>
<header>
  <h1>ポスター工房</h1>
  <p>要素をドラッグして配置。PNG・PDFで書き出せます。</p>
</header>

<main class="app">
  <div class="panel">
    <section class="group">
      <h2>サイズ</h2>
      <select id="size" aria-label="サイズ"></select>
    </section>
    <section class="group">
      <h2>テンプレート(初期配置と背景)</h2>
      <div class="tpls" id="tpls"></div>
      <p class="note">選ぶと見出し・サブ・詳細・QR・メイン画像が配置し直されます。追加した要素はそのまま残ります。</p>
    </section>
    <section class="group">
      <h2>配色</h2>
      <div class="pals" id="pals"></div>
      <div class="row">
        <label>背景<input type="color" id="bg" data-g="bg"></label>
        <label>文字<input type="color" id="fg" data-g="fg"></label>
        <label>強調<input type="color" id="accent" data-g="accent"></label>
      </div>
    </section>
    <section class="group">
      <h2>要素</h2>
      <div class="row">
        <button type="button" class="btn" id="addText">+ テキスト</button>
        <label class="btn" style="margin:0;color:var(--fg)">+ 画像<input type="file" id="addImg" accept="image/*" hidden></label>
        <button type="button" class="btn" id="addQr">+ QR</button>
      </div>
      <div class="layers" id="layers"></div>
    </section>
    <section class="group">
      <h2>選択中の要素</h2>
      <div id="props" style="display:flex;flex-direction:column;gap:10px"></div>
    </section>
    <section class="group">
      <h2>書き出し</h2>
      <div class="row">
        <button type="button" class="btn primary" id="expPng">PNG</button>
        <button type="button" class="btn primary" id="expPdf">PDF</button>
      </div>
      <button type="button" class="btn" id="expJson">編集状態の保存・読込</button>
    </section>
  </div>

  <div class="stage">
    <div class="bar">
      <button type="button" class="btn sm" id="undoBtn" disabled>元に戻す</button>
      <button type="button" class="btn sm" id="redoBtn" disabled>やり直し</button>
      <span class="hint">ドラッグで移動、角で拡縮、上の丸で回転。矢印キーで微調整、Altでスナップ解除。</span>
    </div>
    <div class="cvwrap"><canvas id="cv" aria-label="ポスターのプレビュー"></canvas><div id="ov"></div></div>
    <p class="meta" id="meta"></p>
  </div>
</main>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="sheet-head"><h2 id="mTitle"></h2><button type="button" class="btn" id="mClose">閉じる</button></div>
    <div id="mBody" style="display:flex;flex-direction:column;gap:12px"></div>
  </div>
</div>

<script>
const SIZES = [
  { id: 'a4p', label: 'A4 縦', w: 1654, h: 2339, mm: [210, 297] },
  { id: 'a4l', label: 'A4 横', w: 2339, h: 1654, mm: [297, 210] },
  { id: 'a3p', label: 'A3 縦', w: 2339, h: 3307, mm: [297, 420] },
  { id: 'a3l', label: 'A3 横', w: 3307, h: 2339, mm: [420, 297] },
  { id: 'sq', label: 'SNS 正方形 1080×1080', w: 1080, h: 1080 },
  { id: 'story', label: 'SNS 縦長 1080×1920', w: 1080, h: 1920 },
];
const FONTS = {
  dela: { label: 'デラゴシック(極太)', fam: 'Dela Gothic One', w: 400 },
  noto: { label: 'ノトサンズ(太さ選択可)', fam: 'Noto Sans JP', w: 700, multi: true },
  maru: { label: 'ゼン丸ゴシック', fam: 'Zen Maru Gothic', w: 900 },
  mincho: { label: 'しっぽり明朝', fam: 'Shippori Mincho B1', w: 800 },
  antique: { label: 'ゼンアンティーク', fam: 'Zen Antique', w: 400 },
  dot: { label: 'ドットゴシック16', fam: 'DotGothic16', w: 400 },
};
const TPLS = [
  { id: 'type', name: '活字', d: '見出しを横幅いっぱいに' },
  { id: 'block', name: 'ブロック', d: '色面に反転文字' },
  { id: 'circle', name: '円', d: '大きな円と文字' },
  { id: 'photo', name: '写真', d: '全面写真と下置き文字' },
  { id: 'stripes', name: 'ストライプ', d: '斜線と枠' },
  { id: 'vertical', name: '縦書き', d: '右から左へ' },
];
const PALS = [
  ['藍と黄', '#16205b', '#f5f3ea', '#ffcf3f'],
  ['墨と朱', '#121212', '#f2ede4', '#e8472b'],
  ['紙と青', '#f1efe9', '#16181d', '#2447e0'],
  ['若草', '#0f3d2e', '#f3f1e3', '#c8f169'],
  ['桃', '#ffd9e0', '#2a1021', '#e0245e'],
];
const DEF_TEXT = {
  head: '言葉は\n街に\n灯る', sub: 'ことばのポスター展 2026(サンプル)',
  details: '10.24 SAT – 11.03 SUN\n会場名はここに / 入場無料\n詳細はQRコードから',
};
const VMAP = { 'ー': '｜', '—': '｜', '―': '｜', '「': '﹁', '」': '﹂', '『': '﹃', '』': '﹄', '（': '︵', '）': '︶', '(': '︵', ')': '︶', '…': '︙', '～': '︴' };
const TEXT_BASE = { type: 'text', role: null, x: .1, y: .1, w: .5, h: .1, rot: 0, text: '', font: 'noto', wt: 700, size: .04, color: 'fg', ls: 0, lh: 1.15, align: 'left', vertical: false, shadow: false, sw: 0, sc: 'bg', accLast: false };
let uid = 0;
const nid = () => 'o' + (++uid) + Math.random().toString(36).slice(2, 5);
const mkText = p => ({ id: nid(), ...TEXT_BASE, ...p });
const mkQr = p => ({ id: nid(), type: 'qr', role: null, x: .7, y: .7, w: .2, h: .2, rot: 0, url: 'https://example.com', ...p });
const mkImg = p => ({ id: nid(), type: 'image', role: null, x: .2, y: .2, w: .5, h: .3, rot: 0, src: '', fit: 'cover', grad: false, ...p });
const $ = id => document.getElementById(id);

let S = { size: 'a4p', tpl: 'type', bg: PALS[0][1], fg: PALS[0][2], accent: PALS[0][3], objs: [] };
let sel = null;
const byId = id => S.objs.find(o => o.id === id);
const dims = () => SIZES.find(s => s.id === S.size) || SIZES[0];
const rc = c => S[c] || c;
const hexA = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
const fontStr = (o, px) => { const f = FONTS[o.font] || FONTS.noto; return `${f.multi ? o.wt : f.w} ${px}px "${f.fam}", "Noto Sans JP", sans-serif`; };
const sctx = document.createElement('canvas').getContext('2d');

/* ---------- 画像キャッシュ ---------- */
const imgs = new Map();
function loadImg(src) {
  let e = imgs.get(src);
  if (!e) {
    e = { im: new Image(), ok: false };
    e.p = new Promise(r => { e.im.onload = () => { e.ok = true; r(); schedule(); }; e.im.onerror = r; });
    e.im.src = src; imgs.set(src, e);
  }
  return e;
}
const getImg = src => { const e = loadImg(src); return e.ok ? e.im : null; };
function readImageFile(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, 1600 / Math.max(im.width, im.height));
        const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res({ src: c.toDataURL(f.type === 'image/png' ? 'image/png' : 'image/jpeg', .85), ratio: c.height / c.width });
      };
      im.onerror = rej; im.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(f);
  });
}

/* ---------- QR ---------- */
const qrCache = new Map();
function qrFor(url) {
  if (qrCache.has(url)) return qrCache.get(url);
  let q = null;
  try { q = qrcode(0, 'M'); q.addData(url); q.make(); } catch (e) { q = null; }
  qrCache.set(url, q); return q;
}

/* ---------- フォント・テキスト計測 ---------- */
async function ensureFonts() {
  const jobs = [];
  for (const o of S.objs) if (o.type === 'text') {
    const f = FONTS[o.font] || FONTS.noto;
    jobs.push(document.fonts.load(`${f.multi ? o.wt : f.w} 40px "${f.fam}"`, o.text));
  }
  try { await Promise.all(jobs); } catch (e) {}
}
function wrapLines(ctx, o, maxW, px) {
  const mw = s => ctx.measureText(s).width + Array.from(s).length * o.ls * px;
  const out = [];
  for (const para of o.text.split('\n')) {
    let line = '';
    for (const tk of para.match(/[\x21-\x7e]+|\s+|[^\x00-\x7f]/gu) || ['']) {
      if (line && mw(line + tk) > maxW) { out.push(line.trimEnd()); line = tk.trimStart(); }
      else line += tk;
    }
    out.push(line.trimEnd());
  }
  return out;
}
// 枠に収まる最大のフォントサイズ(Uに対する比)を求める
function fitText(o, W, H) {
  const U = Math.min(W, H), bw = o.w * W, bh = o.h * H;
  const lines = o.text.split('\n').filter(l => l.trim());
  if (!lines.length) return;
  if (o.vertical) {
    const maxLen = Math.max(...lines.map(l => Array.from(l).length));
    o.size = Math.min(bh / (maxLen * (1.06 + o.ls)), bw / (lines.length * o.lh * 1.1)) / U;
  } else {
    sctx.font = fontStr(o, 100);
    const mw = Math.max(...lines.map(l => sctx.measureText(l).width + Array.from(l).length * o.ls * 100));
    o.size = Math.min(100 * bw / mw, bh / (lines.length * o.lh)) / U;
  }
}

/* ---------- 領域とテンプレート ---------- */
function zones(W, H, { hasFoot, hasImg, photo }) {
  const U = Math.min(W, H), m = U * 0.075, gap = m * 0.5, fh = hasFoot ? U * 0.16 : 0;
  const foot = { x: m, y: H - m - fh, w: W - 2 * m, h: fh };
  const body = { x: m, y: m, w: W - 2 * m, h: H - 2 * m - (fh ? fh + gap * 1.5 : 0) };
  let head = body, imgBox = null;
  if (hasImg) {
    if (W >= H * 1.15) { const hw = body.w * 0.56; head = { ...body, w: hw }; imgBox = { x: body.x + hw + gap, y: body.y, w: body.w - hw - gap, h: body.h }; }
    else { const hh = body.h * 0.55; head = { ...body, h: hh }; imgBox = { x: body.x, y: body.y + hh + gap, w: body.w, h: body.h - hh - gap }; }
  } else if (photo) head = { ...body, y: body.y + body.h * 0.35, h: body.h * 0.65 };
  return { U, m, gap, fh, foot, body, head, imgBox };
}
const zflags = () => ({
  hasFoot: S.objs.some(o => o.role === 'details' || o.role === 'qr'),
  hasImg: S.objs.some(o => o.role === 'img') && S.tpl !== 'photo',
  photo: S.tpl === 'photo',
});

async function applyTemplate(tpl) {
  S.tpl = tpl;
  const role = r => S.objs.find(o => o.role === r);
  const hd = role('head'), sb = role('sub'), dt = role('details'), qo = role('qr'), im = role('img');
  const d = dims(), W = d.w, H = d.h, U = Math.min(W, H);
  const z = zones(W, H, { hasFoot: !!(dt || qo), hasImg: !!im && tpl !== 'photo', photo: tpl === 'photo' });
  await ensureFonts();
  const fx = r => ({ x: r.x / W, y: r.y / H, w: r.w / W, h: r.h / H });
  const out = [];
  if (im) out.push({ ...im, ...fx(tpl === 'photo' ? { x: 0, y: 0, w: W, h: H } : z.imgBox), rot: 0, grad: tpl === 'photo' });

  let subH = 0, subO = null;
  if (sb) {
    const sz = 0.036;
    subO = { ...sb, size: sz, wt: 700, font: 'noto', ls: 0, lh: 1.45, rot: 0, vertical: false, shadow: false, sw: 0, accLast: false,
      color: tpl === 'block' ? 'bg' : tpl === 'circle' ? 'fg' : 'accent', align: tpl === 'stripes' ? 'center' : 'left' };
    sctx.font = fontStr(subO, sz * U);
    const n = Math.min(3, wrapLines(sctx, subO, z.head.w, sz * U).length), h = n * sz * U * 1.45;
    Object.assign(subO, fx({ x: z.head.x, y: z.head.y + z.head.h - h, w: z.head.w, h }));
    subH = h + z.gap;
  }
  if (hd) {
    const vert = tpl === 'vertical';
    const o = { ...hd, rot: 0, ls: 0, lh: vert ? 1.15 : 1.08, vertical: vert, shadow: false, sw: 0,

    let a = Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI + 90;
    if (e.shiftKey) a = Math.round(a / 15) * 15;
    a = ((a + 540) % 360) - 180; o.rot = Math.round(a * 10) / 10;
  } else {
    const th = o0.rot * Math.PI / 180, w0 = o0.w * r.width, h0 = o0.h * r.height;
    const c0 = [r.left + (o0.x + o0.w / 2) * r.width, r.top + (o0.y + o0.h / 2) * r.height];
    const sx = mode.includes('e') ? 1 : mode.includes('w') ? -1 : 0, sy = mode.includes('s') ? 1 : mode.includes('n') ? -1 : 0;
    const off = rot2(sx * w0 / 2, sy * h0 / 2, th), A = [c0[0] - off[0], c0[1] - off[1]];
    const [vx, vy] = rot2(e.clientX - A[0], e.clientY - A[1], -th);
    let w = w0, h = h0;
    if (sx && sy) { // 角: 縦横比を保ったまま拡縮(文字はサイズも変える)
      const f = Math.max(((sx * vx) * w0 + (sy * vy) * h0) / (w0 * w0 + h0 * h0), 12 / Math.min(w0, h0));
      w = w0 * f; h = h0 * f; if (o.type === 'text') o.size = o0.size * f;
    } else if (sx) w = Math.max(12, sx * vx); else h = Math.max(12, sy * vy);
    const nc = rot2(sx * w / 2, sy * h / 2, th);
    o.w = w / r.width; o.h = h / r.height;
    o.x = (A[0] + nc[0] - r.left) / r.width - o.w / 2; o.y = (A[1] + nc[1] - r.top) / r.height - o.h / 2;
  }
  placeOverlay(); schedule();
});
const endDrag = () => { if (drag && drag.moved) { commit(); renderProps(); } showGuides([]); drag = null; };
ov.addEventListener('pointerup', endDrag); ov.addEventListener('pointercancel', endDrag);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); return; }
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || !$('modal').hidden) return;
  const mod = e.metaKey || e.ctrlKey, o = byId(sel);
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  else if (!o) return;
  else if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); act('dup'); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); act('del'); }
  else if (e.key.startsWith('Arrow')) {
    e.preventDefault(); const r = cv.getBoundingClientRect(), st = e.shiftKey ? 10 : 1;
    if (e.key === 'ArrowLeft') o.x -= st / r.width; if (e.key === 'ArrowRight') o.x += st / r.width;
    if (e.key === 'ArrowUp') o.y -= st / r.height; if (e.key === 'ArrowDown') o.y += st / r.height;
    placeOverlay(); schedule(); commitSoon();
  }
});

/* ---------- 書き出し ---------- */
function openModal(title, html) { $('mTitle').textContent = title; $('mBody').innerHTML = html; $('modal').hidden = false; }
const closeModal = () => { $('modal').hidden = true; };
$('mClose').onclick = closeModal;
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
const SAVE_NOTE = '<p class="note">保存できない場合は、画像を右クリック(スマホは長押し)で保存してください。</p>';
// ビューアでは downloads 機能、ローカルや Pages では <a download> で保存する
async function saveFile(name, blob, msg, alt) {
  try {
    const dl = window.claude && await window.claude.use('downloads');
    if (dl) { await dl.save({ filename: name, data: blob }); msg.textContent = '保存しました。'; return; }
    if (window.claude) { msg.textContent = alt; return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  } catch (e) { msg.textContent = e && e.code === 'declined' ? '保存をキャンセルしました。' : '保存できませんでした。'; }
}
$('expPng').onclick = async () => {
  const c = await renderFull(), url = c.toDataURL('image/png');
  openModal('PNGを書き出し', `<img class="out" src="${url}" alt="書き出し結果"><p class="note">${c.width} × ${c.height} px</p>
    <div class="row"><button type="button" class="btn primary" id="dl">PNGを保存</button><button type="button" class="btn" id="cp">クリップボードにコピー</button></div>
    <p class="note" id="cpMsg"></p>${SAVE_NOTE}`);
  $('dl').onclick = () => c.toBlob(b => saveFile('poster.png', b, $('cpMsg'), 'この環境では保存ボタンを使えません。上の画像を右クリック(スマホは長押し)で保存するか、コピーを使ってください。'));
  $('cp').onclick = () => c.toBlob(async b => {
    try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': b })]); $('cpMsg').textContent = 'コピーしました。'; }
    catch (e) { $('cpMsg').textContent = 'コピーできませんでした。画像を右クリックで保存してください。'; }
  });
};
function makePdf(jpeg, w, h, pw, ph) {
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const push = d => { const b = typeof d === 'string' ? enc.encode(d) : d; parts.push(b); len += b.length; };
  const obj = (n, s) => { offs[n] = len; push(`${n} 0 obj\n${s}\nendobj\n`); };
  push('%PDF-1.4\n');
  obj(1, '<</Type/Catalog/Pages 2 0 R>>');
  obj(2, '<</Type/Pages/Kids[3 0 R]/Count 1>>');
  obj(3, `<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw} ${ph}]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>`);
  offs[4] = len;
  push(`4 0 obj\n<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpeg.length}>>\nstream\n`);
  push(jpeg); push('\nendstream\nendobj\n');
  const cs = `q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
  obj(5, `<</Length ${cs.length}>>\nstream\n${cs}\nendstream`);
  const xref = len;
  push(`xref\n0 6\n0000000000 65535 f \n${offs.slice(1).map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('')}trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, { type: 'application/pdf' });
}
$('expPdf').onclick = async () => {
  const c = await renderFull(), d = dims(), jpg = c.toDataURL('image/jpeg', 0.92);
  const bytes = Uint8Array.from(atob(jpg.split(',')[1]), ch => ch.charCodeAt(0));
  const pw = d.mm ? d.mm[0] * 72 / 25.4 : d.w * 0.75, ph = d.mm ? d.mm[1] * 72 / 25.4 : d.h * 0.75;
  const pdf = makePdf(bytes, c.width, c.height, pw.toFixed(2), ph.toFixed(2));
  openModal('PDFを書き出し', `<img class="out" src="${jpg}" alt="PDFの内容"><p class="note">${d.label}${d.mm ? `(${d.mm[0]} × ${d.mm[1]} mm)` : ''} · 1ページ</p>
    <div class="row"><button type="button" class="btn primary" id="dlPdf">PDFを保存</button></div><p class="note" id="pdfMsg"></p>`);
  $('dlPdf').onclick = () => saveFile('poster.pdf', pdf, $('pdfMsg'), 'この環境ではPDFを保存できません。PNGを保存して印刷するか、ローカルの poster.html で書き出してください。');
};
$('expJson').onclick = () => {
  openModal('編集状態の保存・読込', `<p class="note">下のテキストを保存しておけば、あとで貼り付けて復元できます。画像も含みます。</p>
    <textarea id="js" aria-label="編集状態のJSON"></textarea>
    <div class="row"><button type="button" class="btn" id="jsCopy">コピー</button><button type="button" class="btn primary" id="jsLoad">この内容を読み込む</button></div>
    <label>ファイルから読み込む<input type="file" id="jsFile" accept=".json,application/json"></label><p class="note" id="jsMsg"></p>`);
  $('js').value = JSON.stringify(S);
  const load = t => {
    try { S = norm(JSON.parse(t)); sel = null; commit(); closeModal(); fullSync(); }
    catch (e) { $('jsMsg').textContent = '読み込めませんでした。保存したテキストをそのまま貼り付けてください。'; }
  };
  $('jsLoad').onclick = () => load($('js').value);
  $('jsFile').onchange = e => e.target.files[0] && e.target.files[0].text().then(load);
  $('jsCopy').onclick = async () => {
    try { await navigator.clipboard.writeText($('js').value); $('jsMsg').textContent = 'コピーしました。'; }
    catch (e) { $('js').select(); $('jsMsg').textContent = '選択しました。コピーしてください。'; }
  };
};

/* ---------- 起動 ---------- */
function norm(j) {
  if (!j || !Array.isArray(j.objs)) throw new Error('bad');
  const base = { text: TEXT_BASE, image: mkImg({}), qr: mkQr({}) };
  return {
    size: SIZES.some(s => s.id === j.size) ? j.size : 'a4p', tpl: TPLS.some(t => t.id === j.tpl) ? j.tpl : 'type',
    bg: j.bg || PALS[0][1], fg: j.fg || PALS[0][2], accent: j.accent || PALS[0][3],
    objs: j.objs.filter(o => base[o.type]).map(o => ({ ...base[o.type], ...o, id: nid() })),
  };
}
(async () => {
  try { S = norm(JSON.parse(localStorage.getItem('poster-kobo2'))); } catch (e) { S = null; }
  if (!S) {
    S = { size: 'a4p', tpl: 'type', bg: PALS[0][1], fg: PALS[0][2], accent: PALS[0][3], objs: [
      mkText({ role: 'head', text: DEF_TEXT.head, font: 'dela' }), mkText({ role: 'sub', text: DEF_TEXT.sub }),
      mkText({ role: 'details', text: DEF_TEXT.details }), mkQr({ role: 'qr' })] };
    await applyTemplate('type');
  }
  commit(); fullSync();
})();
</script>
